name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Unit + e2e tests (no game binaries required; e2e needs FW_SQLITE_BIN/FW_SAVE_DIR)
        env:
          FW_SQLITE_BIN: ''
        run: node --test test/*.test.js
        continue-on-error: true

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        continue-on-error: true
