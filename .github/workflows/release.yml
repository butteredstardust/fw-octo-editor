name: Build and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      FW_SQLITE_BIN: ${{ github.workspace }}\tools\sqlite3mc\bin\sqlite3mc_shell_x64.exe
      GVAS_UESAVE_BIN: ${{ github.workspace }}\tools\uesave-src\target\release\uesave.exe
      FW_RELEASE_KEY_FILE: ${{ github.workspace }}\fwinter-db-key.txt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install webapp dependencies
        run: npm ci
        working-directory: webapp

      - name: Install Inno Setup 6
        run: choco install innosetup -y

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build uesave
        run: |
          git clone https://github.com/trumank/uesave.git tools/uesave-src
          cd tools/uesave-src
          git checkout --detach 1917a22ab69e9a4045e613d9d7f39a49fe00bd46
          cargo build --release -p uesave_cli

      - name: Obtain sqlite3mc_shell_x64.exe
        shell: pwsh
        run: |
          $archiveName = 'sqlite3mc-2.3.6-sqlite-3.53.3-win64.zip'
          $archiveUrl = "https://github.com/utelle/SQLite3MultipleCiphers/releases/download/v2.3.6/$archiveName"
          $expectedSha256 = '789ee3d846a21d01045fb027286735447b17cccf3fb07979fbef354a815defd7'
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $extractPath = Join-Path $env:RUNNER_TEMP 'sqlite3mc'

          Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "SQLite3MC archive SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }

          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath -Force
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $env:FW_SQLITE_BIN) | Out-Null
          Copy-Item -LiteralPath (Join-Path $extractPath 'bin\sqlite3mc_shell_x64.exe') -Destination $env:FW_SQLITE_BIN -Force
          & $env:FW_SQLITE_BIN -version
          if ($LASTEXITCODE -ne 0) {
            throw "SQLite3MC smoke test failed with exit code $LASTEXITCODE"
          }

      - name: Prepare DB key
        run: |
          Set-Content -LiteralPath "fwinter-db-key.txt" -Value "${{ secrets.FWINTER_DB_KEY }}" -NoNewline
        shell: pwsh

      - name: Run unit tests
        run: npm test
        working-directory: webapp

      - name: Lint
        run: npm run lint
        working-directory: webapp

      - name: Build installer
        shell: pwsh
        run: |
          $isccPath = (Get-Command ISCC.exe -ErrorAction Stop).Source
          powershell -File releases/build.ps1 -IsccPath $isccPath
        working-directory: ${{ github.workspace }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: releases/fwinter-save-editor-*.exe
          retention-days: 30

      - name: Extract version
        id: version
        run: echo "VERSION=$(node -p "require('./webapp/package.json').version")" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          body_path: releases/nexus-description.md
          files: releases/fwinter-save-editor-*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
